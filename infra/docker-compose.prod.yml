services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ${DIGMO_IMAGE_PREFIX:?Set DIGMO_IMAGE_PREFIX}/digmo-api:${DIGMO_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      TZ: Asia/Shanghai
      WATCHLIST_DB_PATH: /app/apps/api/data/watchlist.sqlite
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a strong AUTH_JWT_SECRET}
      AUTH_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:?Set a strong initial admin password}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DECISION_AI_ALLOWED_ORIGINS: ${DECISION_AI_ALLOWED_ORIGINS:-https://api.openai.com}
    volumes:
      - api_data:/app/apps/api/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    image: ${DIGMO_IMAGE_PREFIX:?Set DIGMO_IMAGE_PREFIX}/digmo-web:${DIGMO_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      API_UPSTREAM: http://api:3001
    ports:
      - "127.0.0.1:${DIGMO_WEB_PORT:-3000}:3000"

volumes:
  redisdata:
  api_data:
